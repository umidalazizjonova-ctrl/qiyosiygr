<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0284c7"/>
      <stop offset="60%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#fed7aa"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#06b6d4"/>
      <stop offset="50%" stopColor="#0d9488"/>
      <stop offset="100%" stopColor="#0f766e"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#d97706"/>
      <stop offset="50%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#skyGrad)"/>
  <rect y="360" width="800" height="90" fill="#78350f"/>
  <rect y="375" width="800" height="75" fill="#92400e"/>
  
  <!-- Central Portal (Peshtak) -->
  <rect x="260" y="110" width="280" height="250" fill="url(#brickGrad)"/>
  <path d="M 310 360 L 310 220 Q 400 160 490 220 L 490 360 Z" fill="#1e293b"/>
  <path d="M 330 360 L 330 240 Q 400 190 470 240 L 470 360 Z" fill="#0f172a"/>
  
  <!-- Turquoise Dome Behind -->
  <path d="M 350 110 Q 400 30 450 110 Z" fill="url(#domeGrad)"/>
  <rect x="396" y="20" width="8" height="20" fill="#f59e0b"/>
  
  <!-- Left Minaret -->
  <rect x="230" y="80" width="30" height="280" fill="#b45309"/>
  <polygon points="225,80 265,80 245,45" fill="url(#domeGrad)"/>
  
  <!-- Right Minaret -->
  <rect x="540" y="80" width="30" height="280" fill="#b45309"/>
  <polygon points="535,80 575,80 555,45" fill="url(#domeGrad)"/>
  
  <!-- Tile Mosaic Ornaments -->
  <rect x="275" y="125" width="250" height="20" fill="#0284c7"/>
  <circle cx="400" cy="145" r="10" fill="#f59e0b"/>
</svg>

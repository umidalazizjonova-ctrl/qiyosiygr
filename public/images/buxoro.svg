<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="buxSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0369a1"/>
      <stop offset="70%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#fed7aa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#buxSky)"/>
  <rect y="360" width="800" height="90" fill="#b45309"/>
  
  <!-- Kalyan Minaret (Minorai Kalon) in Bukhara -->
  <polygon points="370,360 430,360 415,80 385,80" fill="#d97706"/>

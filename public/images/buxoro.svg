  <rect x="375" y="65" width="50" height="18" fill="#92400e"/>
  <!-- Conical dome -->
  <polygon points="380,65 420,65 400,30" fill="#0d9488"/>
  
  <!-- Kalyan Mosque / Ark Silhouette -->
  <rect x="220" y="240" width="120" height="120" fill="#78350f"/>
  <path d="M 250 240 Q 280 180 310 240 Z" fill="#06b6d4"/>
  <rect x="460" y="220" width="160" height="140" fill="#78350f"/>
  <path d="M 500 220 Q 540 160 580 220 Z" fill="#06b6d4"/>

    <circle cx="420" cy="240" r="16"/>
    <circle cx="445" cy="245" r="14"/>
    <circle cx="375" cy="275" r="15"/>
    <circle cx="405" cy="270" r="16"/>
    <circle cx="430" cy="280" r="15"/>

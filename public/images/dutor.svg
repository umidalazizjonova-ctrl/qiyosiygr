<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#78350f"/>
      <stop offset="50%" stopColor="#92400e"/>
      <stop offset="100%" stopColor="#451a03"/>
    </linearGradient>
    <radialGradient id="bowlGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#b45309"/>
      <stop offset="70%" stopColor="#78350f"/>
      <stop offset="100%" stopColor="#292524"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#042f2e"/>
  
  <!-- Dutor Body (Bowl) -->
  <ellipse cx="400" cy="310" rx="100" ry="80" fill="url(#bowlGrad)" stroke="#fef3c7" strokeWidth="2"/>
  <ellipse cx="400" cy="300" rx="90" ry="70" fill="#78350f"/>
  
  <!-- Dutor Long Neck -->
  <rect x="393" y="40" width="14" height="230" rx="5" fill="url(#neckGrad)"/>
  
  <!-- Headstock & Pegs -->
  <rect x="390" y="25" width="20" height="40" rx="4" fill="#451a03"/>
  <circle cx="380" cy="35" r="7" fill="#f59e0b"/>
  <circle cx="420" cy="45" r="7" fill="#f59e0b"/>
  
  <!-- Two Silk Strings (Dutor = 2 strings) -->
  <line x1="398" y1="35" x2="398" y2="345" stroke="#fef08a" strokeWidth="2"/>
  <line x1="402" y1="35" x2="402" y2="345" stroke="#fef08a" strokeWidth="2"/>
  
  <!-- Frets (Pardalar) -->
  <line x1="393" y1="90" x2="407" y2="90" stroke="#f59e0b" strokeWidth="1.5"/>
  <line x1="393" y1="120" x2="407" y2="120" stroke="#f59e0b" strokeWidth="1.5"/>
  <line x1="393" y1="150" x2="407" y2="150" stroke="#f59e0b" strokeWidth="1.5"/>
  <line x1="393" y1="180" x2="407" y2="180" stroke="#f59e0b" strokeWidth="1.5"/>
  <line x1="393" y1="210" x2="407" y2="210" stroke="#f59e0b" strokeWidth="1.5"/>
</svg>

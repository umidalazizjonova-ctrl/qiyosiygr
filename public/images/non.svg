<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="breadGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fde68a"/>
      <stop offset="60%" stopColor="#f59e0b"/>
      <stop offset="90%" stopColor="#b45309"/>
      <stop offset="100%" stopColor="#78350f"/>
    </radialGradient>
    <radialGradient id="centerDent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#fef3c7"/>
      <stop offset="70%" stopColor="#fde68a"/>
      <stop offset="100%" stopColor="#d97706"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#042f2e"/>
  
  <!-- Traditional Uzbek Bread (Samarqand / Toshkent Non) -->
  <circle cx="400" cy="225" r="170" fill="url(#breadGrad)" stroke="#451a03" strokeWidth="6"/>
  <!-- Middle stamped recess -->
  <circle cx="400" cy="225" r="95" fill="url(#centerDent)" stroke="#92400e" strokeWidth="4" strokeDasharray="6 4"/>
  
  <!-- Chekich stamps pattern (traditional bread stamper) -->
  <circle cx="400" cy="225" r="30" fill="#b45309" opacity="0.8"/>
  <circle cx="400" cy="225" r="8" fill="#451a03"/>
  <circle cx="400" cy="170" r="10" fill="#92400e"/>
  <circle cx="400" cy="280" r="10" fill="#92400e"/>
  <circle cx="345" cy="225" r="10" fill="#92400e"/>
  <circle cx="455" cy="225" r="10" fill="#92400e"/>
  <circle cx="360" cy="185" r="8" fill="#92400e"/>
  <circle cx="440" cy="185" r="8" fill="#92400e"/>
  <circle cx="360" cy="265" r="8" fill="#92400e"/>
  <circle cx="440" cy="265" r="8" fill="#92400e"/>
  
  <!-- Nigella seeds (Sedana) -->
  <circle cx="380" cy="210" r="3" fill="#1e293b"/>
  <circle cx="420" cy="240" r="3" fill="#1e293b"/>
  <circle cx="390" cy="235" r="3" fill="#1e293b"/>
  <circle cx="410" cy="215" r="3" fill="#1e293b"/>
  <circle cx="425" cy="205" r="3" fill="#1e293b"/>
</svg>
